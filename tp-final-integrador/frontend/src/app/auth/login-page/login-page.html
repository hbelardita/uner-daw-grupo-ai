<main class="min-h-dvh flex flex-col justify-center px-4 bg-slate-50">
  <p-card
    class="w-full max-w-100 mx-auto rounded-2xl shadow-lg border border-slate-300 bg-white p-6"
  >
    <ng-template #title>
      <div
        class="w-12 h-12 rounded-full bg-primary-subtle flex items-center justify-center mx-auto mb-3"
      >
        <i class="pi pi-heart-fill text-primary text-xl" aria-hidden="true"></i>
      </div>
      <h1 class="text-xl md:text-2xl font-bold text-slate-900 text-center">Clínica Médica</h1>
    </ng-template>

    <ng-template #subtitle>
      <p class="text-sm text-slate-600 text-center mt-1">Portal de Gestión de Turnos</p>
    </ng-template>

    <form
      [formGroup]="formulario"
      (ngSubmit)="enviar()"
      aria-label="Formulario de inicio de sesión"
      class="flex flex-col gap-5 mt-3"
      novalidate
    >
      <div class="flex flex-col gap-1.5">
        <label for="documento" class="text-sm font-medium text-slate-700">
          Número de documento
        </label>
        <p-iconfield>
          <p-inputicon class="pi pi-id-card text-slate-400" />
          <input
            pInputText
            id="documento"
            type="text"
            [formControl]="documento"
            [invalid]="esInvalido('documento')"
            autocomplete="username"
            inputmode="numeric"
            placeholder="12345678"
            class="w-full rounded-lg text-base tabular-nums"
            [attr.aria-describedby]="
              esInvalido('documento') ? 'documento-error' : 'documento-ayuda'
            "
          />
        </p-iconfield>

        @if (esInvalido('documento')) {
          <span
            id="documento-error"
            class="text-xs text-rose-700 flex items-center gap-1 font-medium"
          >
            <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
            {{ obtenerMensajeError('documento') }}
          </span>
        } @else {
          <span id="documento-ayuda" class="text-xs text-slate-500">
            Ingresa 7 u 8 dígitos, sin puntos.
          </span>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="clave" class="text-sm font-medium text-slate-700"> Contraseña </label>
        <p-password
          inputId="clave"
          [formControl]="clave"
          [feedback]="false"
          fluid
          [toggleMask]="true"
          autocomplete="current-password"
          placeholder="••••••••"
          [invalid]="esInvalido('clave')"
          inputStyleClass="w-full rounded-lg text-base"
          [attr.aria-describedby]="esInvalido('clave') ? 'clave-error' : null"
        />

        @if (esInvalido('clave')) {
          <span id="clave-error" class="text-xs text-rose-700 flex items-center gap-1 font-medium">
            <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
            {{ obtenerMensajeError('clave') }}
          </span>
        }
      </div>

      <app-resumen-errores [mensaje]="error()" />

      <div class="pt-2">
        <p-button
          type="submit"
          [label]="cargando() ? 'Ingresando...' : 'Ingresar'"
          [disabled]="cargando()"
          [loading]="cargando()"
          styleClass="w-full min-h-12 rounded-lg font-medium bg-primary hover:bg-primary-hover"
        />
      </div>

      <div class="text-center pt-1 text-sm text-slate-600">
        ¿No podes ingresar? Comunicate con la administración de la clínica.
      </div>
    </form>
  </p-card>
</main>
