@if (items().length > 1) {
  <nav
    aria-label="Navegación inferior"
    class="lg:hidden fixed bottom-0 inset-x-0 z-30 h-16 bg-(--color-card) border-t border-border px-2"
  >
    <div
      class="max-w-md mx-auto h-full grid gap-1 items-center"
      [class.grid-cols-2]="items().length === 2"
      [class.grid-cols-3]="items().length === 3"
    >
      @for (item of items(); track item.ruta) {
        <a
          [routerLink]="item.ruta"
          routerLinkActive="text-[var(--color-primary)] bg-[var(--color-primary-subtle)] font-semibold"
          [routerLinkActiveOptions]="{ exact: item.exacto }"
          ariaCurrentWhenActive="page"
          class="min-h-12 rounded-lg flex flex-col items-center justify-center gap-1 px-2 py-1 text-xs font-medium text-muted-foreground hover:text-foreground transition-colors cursor-pointer"
        >
          <i [class]="item.icono" class="text-base shrink-0" aria-hidden="true"></i>
          <span class="truncate max-w-full">{{ item.etiqueta }}</span>
        </a>
      }
    </div>
  </nav>
}
