<header class="bg-white border-b border-slate-200 shadow-xs sticky top-0 z-30 transition-colors">
  <div class="px-4 md:px-6 h-16 flex items-center justify-between gap-4">
    <div class="flex items-center space-x-3">
      <!-- Botón de apertura de Sidebar en dispositivos móviles -->
      <button
        type="button"
        (click)="toggleSidebar.emit()"
        aria-label="Abrir menú de navegación"
        class="lg:hidden items-center flex justify-center p-2 rounded-lg text-slate-600 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700 transition-colors"
      >
        <i class="pi pi-bars text-xl"></i>
      </button>

      <!-- Identificador de la aplicación en móvil cuando la sidebar está oculta -->
      <div class="flex items-center space-x-2.5 lg:hidden">
        <div
          class="w-8 h-8 rounded-lg bg-teal-700 flex items-center justify-center text-white shadow-xs"
        >
          <i class="pi pi-plus text-sm font-bold"></i>
        </div>
        <span class="font-semibold text-base text-slate-900 tracking-tight"> Clínica </span>
      </div>
    </div>

    <!-- Sección de usuario: nombre, rol con badge en desktop y acción de cierre de sesión -->
    <div class="hidden md:flex items-center space-x-3">
      <div class="hidden lg:flex">
        <app-user-badge tema="light" alineacion="right" />
      </div>

      <div class="h-6 w-px bg-slate-200 hidden lg:block"></div>

      <p-button
        icon="pi pi-sign-out"
        label="Cerrar sesión"
        severity="secondary"
        [outlined]="true"
        size="small"
        (onClick)="cerrarSesion()"
      />
    </div>
  </div>
</header>
