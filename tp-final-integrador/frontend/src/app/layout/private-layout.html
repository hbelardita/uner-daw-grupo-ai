<div class="min-h-screen bg-slate-50 text-slate-900 flex antialiased">
  <!-- Barra lateral de navegación: fija en desktop (>=1024px) y p-drawer en móvil (<1024px) -->
  <app-sidebar [abierto]="sidebarAbierto()" (cerrar)="cerrarSidebar()" />

  <!-- Área principal: Header + Contenido -->
  <div class="flex-1 flex flex-col min-w-0 min-h-screen">
    <app-header (toggleSidebar)="alternarSidebar()" />

    <main id="contenido-principal" class="flex-1 overflow-y-auto p-4 md:p-6">
      <div class="max-w-7xl mx-auto w-full">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
