<div
  class="flex flex-col"
  [class.items-end]="alineacion() === 'right'"
  [class.text-right]="alineacion() === 'right'"
  [class.items-start]="alineacion() === 'left'"
  [class.text-left]="alineacion() === 'left'"
>
  <span
    class="text-sm font-semibold text-foreground truncate max-w-48 sm:max-w-60 font-heading"
    [title]="nombreUsuario()"
  >
    {{ nombreUsuario() }}
  </span>

  @if (etiquetaRol(); as rol) {
    <span class="text-xs font-medium text-foreground mt-0.5">
      {{ rol }}
      @if (mostrarDocumento() && documentoFormateado(); as dni) {
        <span aria-hidden="true"> · </span>
        <span class="tabular-nums">DNI {{ dni }}</span>
      }
    </span>
  }
</div>
