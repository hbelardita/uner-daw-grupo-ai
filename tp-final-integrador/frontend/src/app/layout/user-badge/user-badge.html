<div
  class="flex flex-col"
  [class.items-end]="alineacion() === 'right'"
  [class.text-right]="alineacion() === 'right'"
  [class.items-start]="alineacion() === 'left'"
  [class.text-left]="alineacion() === 'left'"
>
  <span
    class="text-sm font-semibold truncate max-w-44 sm:max-w-56"
    [class.text-slate-900]="tema() === 'light'"
    [class.text-slate-100]="tema() === 'dark'"
    [title]="nombreUsuario()"
  >
    {{ nombreUsuario() }}
  </span>

  @if (rolUsuario(); as rol) {
    <p-tag
      [value]="rol"
      [rounded]="false"
      class="rounded-lg text-xs font-medium mt-0.5"
      [class]="
        tema() === 'light'
          ? 'bg-slate-100 text-slate-700 border-slate-200'
          : 'bg-slate-800 text-teal-400 border-slate-700'
      "
    />
  }
</div>
