<div class="flex items-center gap-2 flex-wrap">
  <p-button
    icon="pi pi-chevron-left"
    [text]="true"
    severity="secondary"
    ariaLabel="Día anterior"
    [disabled]="!hayDiaAnterior()"
    (click)="diaAnterior()"
  />

  <p-datepicker
    [ngModel]="fecha()"
    (ngModelChange)="alCambiarFechaPicker($event)"
    [showIcon]="true"
    dateFormat="dd/mm/yy"
    [disabledDays]="diasDeshabilitados()"
    [minDate]="minDate()"
    [maxDate]="maxDate()"
    [disabled]="deshabilitado()"
    placeholder="dd/mm/yyyy"
    [class]="anchoClass()"
    inputStyleClass="w-full tabular-nums text-sm font-medium"
    [attr.aria-label]="ariaLabel()"
  />

  <p-button
    icon="pi pi-chevron-right"
    [text]="true"
    severity="secondary"
    ariaLabel="Día siguiente"
    [disabled]="!hayDiaSiguiente()"
    (click)="diaSiguiente()"
  />

  <p-button
    label="Hoy"
    [outlined]="true"
    severity="secondary"
    size="small"
    [disabled]="deshabilitado() || esFechaDeHoy()"
    (click)="irAHoy()"
  />
</div>
